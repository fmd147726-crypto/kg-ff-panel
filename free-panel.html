<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Panel - KG FF PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #05020a;
            --card-bg: #0b0512;
            --border-color: #1a0b2e;
            --neon-pink: #ff0066;
            --neon-green: #00cc66;
            --text-light: #ffffff;
            --text-gray: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; overflow-x: hidden; position: relative; display: flex; flex-direction: column; }

        /* Background Glow Effect */
        .bg-glow {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 102, 0.05) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* Header / Navbar */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 50px; position: relative; z-index: 100;
            border-bottom: 1px solid var(--border-color);
            background: rgba(5, 2, 10, 0.8);
            backdrop-filter: blur(10px);
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        .back-btn {
            color: var(--text-gray); text-decoration: none; font-size: 12px; font-weight: 800;
            letter-spacing: 1px; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { color: var(--neon-pink); }

        .brand { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; border-left: 1px solid #333; padding-left: 20px;}
        .brand-text h2 { font-size: 16px; color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .brand-text p { font-size: 9px; color: var(--text-gray); letter-spacing: 3px; text-transform: uppercase; }

        .header-btn {
            background: transparent; border: 1px solid #333; color: white;
            padding: 8px 15px; border-radius: 6px; font-size: 12px; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .header-btn:hover { border-color: white; }

        /* Main Container */
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; width: 100%; flex: 1; z-index: 10; position: relative; }

        /* Section Header */
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .page-title { font-size: 35px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: white; }
        .page-title span { color: var(--neon-pink); }
        .section-subtitle { font-size: 11px; color: var(--text-gray); letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }
        
        .btn-how-to-skip {
            background: rgba(255, 0, 102, 0.05); border: 1px solid var(--neon-pink); color: var(--neon-pink);
            padding: 10px 20px; border-radius: 8px; font-size: 11px; font-weight: bold; letter-spacing: 1px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-how-to-skip:hover { background: var(--neon-pink); color: white; }

        /* Video Container */
        .video-wrapper {
            width: 100%; aspect-ratio: 16/9; max-height: 450px; background: #000;
            border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 40px;
            border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 10, 0.7); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
        }
        .play-btn {
            width: 70px; height: 70px; background: var(--neon-pink); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 24px;
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.5); padding-left: 5px; transition: 0.3s;
        }
        .video-overlay:hover .play-btn { transform: scale(1.1); box-shadow: 0 0 30px var(--neon-pink); }

        /* Store Grid */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .store-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 30px 20px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; align-items: center;
        }
        .store-card:hover { border-color: #3a1b5e; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .item-icon { font-size: 35px; color: var(--neon-pink); margin-bottom: 15px; }
        .item-icon img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; }
        .item-title { color: white; font-size: 15px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .item-desc { color: var(--text-gray); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; flex: 1; }
        
        .download-btn {
            width: 100%; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; background: transparent;
            font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; text-decoration: none; cursor: pointer; display: block;
        }
        .store-card:hover .download-btn { background: white; color: black; border-color: white; }

        /* RAR Password Box */
        .rar-box {
            background: rgba(255, 0, 102, 0.03); border: 1px dashed rgba(255, 0, 102, 0.3);
            padding: 20px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;
            max-width: 500px; margin: 0 auto; flex-wrap: wrap; gap: 15px;
        }
        .rar-info { display: flex; align-items: center; gap: 15px; }
        .rar-icon { background: var(--neon-pink); width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; }
        .rar-label { font-size: 10px; color: var(--text-gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .rar-value { font-size: 18px; font-weight: 900; color: white; letter-spacing: 1px; }
        
        .copy-btn {
            background: #1a0b2e; border: 1px solid #333; color: white; padding: 10px 20px; border-radius: 6px;
            font-size: 11px; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.3s;
        }
        .copy-btn:hover { background: var(--neon-pink); border-color: var(--neon-pink); }

        /* Toast Notification */
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--neon-green); color: #000;
            padding: 12px 25px; border-radius: 6px; font-size: 12px; font-weight: bold; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 204, 102, 0.3); z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s; transform: translateY(20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

        /* Footer */
        .footer { margin-top: auto; padding: 30px 20px; text-align: center; border-top: 1px solid var(--border-color); background: #030107; font-size: 12px; color: var(--text-gray); letter-spacing: 1px; }

        @media (max-width: 768px) {
            .header { padding: 20px; flex-direction: column; gap: 15px; }
            .brand { border-left: none; padding-left: 0; }
            .section-header { flex-direction: column; align-items: center; text-align: center; }
            .rar-box { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- Header Section -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> BACK</a>
            <a href="index.html" class="brand">
                <div class="brand-text">
                    <h2>KG FF PANEL</h2>
                    <p>PREMIUM CORP</p>
                </div>
            </a>
        </div>
        <a href="#" target="_blank" class="header-btn dynamic-discord" id="nav-discord">
            <i class="fab fa-discord"></i> Join Discord
        </a>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Section Header -->
        <div class="section-header">
            <div>
                <h1 class="page-title">FREE <span>PANEL</span></h1>
                <p class="section-subtitle">Get Free FF Headshot & Aim Assist Tools</p>
            </div>
            <a href="#" target="_blank" class="btn-how-to-skip" id="how-to-skip-btn">
                <i class="fas fa-question-circle"></i> HOW TO SKIP LINK?
            </a>
        </div>

        <!-- Video Tutorial Section -->
        <div class="video-wrapper">
            <!-- Default placeholder video; updated by JS -->
            <iframe id="youtube-iframe" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <div class="video-overlay" id="video-overlay">
                <div class="play-btn"><i class="fas fa-play"></i></div>
            </div>
        </div>

        <div class="divider" style="text-align:center; margin:40px 0; font-size:11px; color:#444; letter-spacing:4px; text-transform:uppercase;">// FREE DOWNLOADS //</div>

        <!-- Dynamic Store Grid -->
        <div class="store-grid" id="free-panel-grid">
            <!-- Items will be injected here via localStorage -->
        </div>

        <!-- RAR Password Box -->
        <div class="rar-box">
            <div class="rar-info">
                <div class="rar-icon"><i class="fas fa-lock"></i></div>
                <div>
                    <div class="rar-label">RAR FILE PASSWORD</div>
                    <div class="rar-value" id="rar-password-display">1</div>
                </div>
            </div>
            <button class="copy-btn" onclick="copyPassword()">
                <i class="far fa-copy"></i> COPY PASSWORD
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 KG FF PANEL. All rights reserved.</p>
    </footer>

    <!-- Toast Notification Element -->
    <div class="toast" id="toast-msg"><i class="fas fa-check-circle"></i> COPIED TO CLIPBOARD!</div>

    <!-- Vanilla JS Logic for LocalStorage (NO FIREBASE) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadGlobalSettings();
            loadPageData();
            initVideoOverlay();
        });

        // 1. Load Settings (Discord Link)
        function loadGlobalSettings() {
            const discordLink = localStorage.getItem('kgff_discord_link') || "https://discord.gg/NZsbZq4C7";
            document.getElementById('nav-discord').href = discordLink;
        }

        // 2. Load Page Specific Data (Video, Skip Link, RAR Pass, Items)
        function loadPageData() {
            // How to skip link
            const skipLink = localStorage.getItem('kgff_how_to_skip') || "https://youtube.com";
            document.getElementById('how-to-skip-btn').href = skipLink;

            // Video URL
            const videoUrl = localStorage.getItem('kgff_free_panel_video') || "https://www.youtube.com/embed/dQw4w9WgXcQ";
            // Ensure API is enabled for autoplay overlay
            const finalVideoUrl = videoUrl.includes('?') ? `${videoUrl}&enablejsapi=1` : `${videoUrl}?enablejsapi=1`;
            document.getElementById('youtube-iframe').src = finalVideoUrl;

            // RAR Password
            const rarPass = localStorage.getItem('kgff_rar_password') || "1";
            document.getElementById('rar-password-display').innerText = rarPass;

            // Free Panel Items Array
            const defaultItems = [
                { title: "FREE PANEL V1.0", desc: "Basic headshot rate increase & anti-lag fix for all devices.", icon: "💻", link: "https://drive.google.com" },
                { title: "FREE PANEL V2.0", desc: "Updated tracking capabilities and smoother drag sensitivity.", icon: "🎮", link: "https://drive.google.com" }
            ];
            const storedItems = JSON.parse(localStorage.getItem('kgff_free_panel_items'));
            const itemsToRender = storedItems && storedItems.length > 0 ? storedItems : defaultItems;

            const grid = document.getElementById('free-panel-grid');
            grid.innerHTML = '';

            itemsToRender.forEach(item => {
                grid.innerHTML += `
                    <div class="store-card">
                        <div class="item-icon">${renderIconHTML(item.icon)}</div>
                        <div class="item-title">${item.title}</div>
                        <div class="item-desc">${item.desc}</div>
                        <a href="${item.link}" target="_blank" class="download-btn">DOWNLOAD FILE <i class="fas fa-download" style="margin-left:5px;"></i></a>
                    </div>
                `;
            });
        }

        // Helper to render emoji or font-awesome
        function renderIconHTML(iconStr) {
            if (iconStr.includes('fa-')) return `<i class="${iconStr}"></i>`;
            if (iconStr.endsWith('.png') || iconStr.endsWith('.jpg')) return `<img src="${iconStr}" alt="icon">`;
            return `<span>${iconStr}</span>`;
        }

        // 3. Video Overlay Logic (Click to play)
        function initVideoOverlay() {
            const overlay = document.getElementById('video-overlay');
            overlay.addEventListener('click', () => {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
                const iframe = document.getElementById('youtube-iframe');
                if (iframe.src) {
                    iframe.src += "&autoplay=1";
                }
            });
        }

        // 4. Copy RAR Password Logic
        function copyPassword() {
            const pwd = document.getElementById('rar-password-display').innerText;
            navigator.clipboard.writeText(pwd).then(() => {
                showToast("PASSWORD COPIED: " + pwd);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
