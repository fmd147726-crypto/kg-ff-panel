<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF PANEL - PC Premium</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --neon-green: #00ff7f;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }
        .orbitron { font-family: 'Orbitron', sans-serif; }

        #mouse-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at var(--x, 50%) var(--y, 50%),
                rgba(168,85,247,.13), transparent 48%
            );
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            background: rgba(13,8,24,.94);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-purple);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            border: 1px solid var(--neon-purple);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: .3s;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        .video-container {
            width: calc(100% - 30px);
            max-width: 800px;
            margin: 20px auto;
            border: 1.5px solid var(--neon-purple);
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 20px rgba(168,85,247,.2);
            position: relative;
            z-index: 1;
        }

        .youtube-thumbnail {
            display: block;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #08040d;
            overflow: hidden;
        }

        .youtube-thumbnail img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .35s, filter .35s;
        }

        .youtube-thumbnail:hover img {
            transform: scale(1.025);
            filter: brightness(.8);
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            border-radius: 14px;
            background: #ff0033;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 18px #0008;
            transition: .25s;
        }

        .play-icon i {
            font-size: 23px;
            color: white;
            margin-left: 4px;
        }

        .youtube-thumbnail:hover .play-icon {
            background: #e60023;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .product-card {
            min-width: 0;
            background: #0f0a1d;
            border: 1.5px solid #1f1a2e;
            border-radius: 18px;
            padding: 13px;
            text-align: center;
            transition: .3s;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px #0008;
        }

        .product-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 13px;
            margin-bottom: 14px;
            border: 1px solid #2d2640;
            background: #08040d;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        .btn-buy {
            background: linear-gradient(90deg, #d400ff, #ff007f);
            color: white;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 4px 15px #ff007f40;
            transition: .3s;
        }

        .btn-buy:hover {
            box-shadow: 0 0 20px var(--neon-pink);
            transform: scale(1.015);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #000e;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 480px;
            border: 1.5px solid var(--neon-pink);
            border-radius: 18px;
            position: relative;
            padding: 24px;
            box-shadow: 0 0 30px #ff007f33;
            margin: auto;
        }

        .modal-title {
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            margin: 5px 22px 20px;
            overflow-wrap: anywhere;
        }

        .package-item {
            width: 100%;
            background: #07030b;
            border: 1px solid #2d2640;
            border-radius: 10px;
            padding: 13px;
            margin-bottom: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
            transition: .2s;
            color: white;
        }

        .package-item:hover { border-color: var(--neon-green); }

        .package-item.selected {
            border: 2px solid var(--neon-green);
            background: #00ff7f0d;
        }

        .package-info {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .package-info i { color: #facc15; }

        .package-price {
            color: var(--neon-green);
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            white-space: nowrap;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin: 18px 0 8px;
        }

        .discord-input {
            width: 100%;
            background: #07030b;
            border: 1px solid var(--neon-pink);
            color: white;
            padding: 13px;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .discord-input:focus {
            border-color: var(--neon-green);
        }

        .discord-input::placeholder { color: #777; }

        .help-text {
            color: #aaa;
            font-size: 13px;
            line-height: 1.65;
            margin-top: 9px;
        }

        .btn-ticket {
            background: linear-gradient(90deg, #00c96b, #00ff91);
            color: #000;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            transition: .3s;
            margin-top: 18px;
        }

        .btn-ticket:hover {
            box-shadow: 0 0 22px #00ff7f55;
        }

        .btn-ticket:disabled {
            opacity: .6;
            cursor: wait;
        }

        .btn-back {
            background: #21142d;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #999;
            font-size: 26px;
            cursor: pointer;
            background: transparent;
            border: 0;
        }

        .notice {
            display: none;
            padding: 11px;
            margin-top: 12px;
            border-radius: 8px;
            font-size: 14
