<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE FIRE APK - KGFF PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #05020a; --card-bg: #0b0512; --border-color: #1a0b2e;
            --neon-pink: #ff0066; --neon-purple: #9d00ff; --orange-color: #ffaa00;
            --neon-green: #00cc66; --text-light: #ffffff; --text-gray: #777777;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }

        #mouse-glow-global {
            position: fixed; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(157, 0, 255, 0.15) 0%, transparent 70%);
            pointer-events: none; transform: translate(-50%, -50%); z-index: 99999;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; border-bottom: 1px solid var(--border-color);
            background: rgba(5, 2, 10, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
        }
        .brand { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .site-logo { width: 35px; height: 35px; border-radius: 8px; border: 1px solid var(--neon-pink); }
        .brand-text h2 { font-size: 15px; color: white; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .brand-text p { font-size: 9px; color: var(--text-gray); letter-spacing: 3px; text-transform: uppercase; }
        .header-right { display: flex; gap: 15px; }
        .nav-btn { background: transparent; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 6px; font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: bold; transition: 0.3s; }
        .nav-btn:hover { border-color: white; background: rgba(255,255,255,0.05); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .top-controls { margin-bottom: 15px; display: flex; }
        .back-btn { background: transparent; border: 1px solid #333; color: white; padding: 8px 20px; border-radius: 6px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-btn:hover { border-color: white; }

        .video-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-bottom: 30px; position: relative; padding-top: 56.25%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-gray); font-size: 16px; font-weight: bold; flex-direction: column; gap: 15px; }
        .video-placeholder i { font-size: 40px; color: #333; }

        /* Title + How To Skip Container */
        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .section-title h2 { font-size: 24px; font-weight: 900; text-transform: uppercase; color: white; margin-bottom: 5px; }
        .section-title p { font-size: 10px; color: var(--text-gray); letter-spacing: 2px; text-transform: uppercase; }

        .skip-btn {
            background: rgba(0, 204, 102, 0.08);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .skip-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 204, 102, 0.4);
        }

        .rar-box { background: rgba(255, 170, 0, 0.05); border: 1px solid rgba(255, 170, 0, 0.3); padding: 15px 20px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .rar-info { display: flex; flex-direction: column; gap: 8px; }
        .rar-title { display: flex; align-items: center; gap: 8px; color: var(--orange-color); font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .rar-pass { font-size: 16px; color: #fff; font-weight: bold; }
        .copy-btn { background: transparent; color: var(--orange-color); border: 1px solid var(--orange-color); padding: 6px 15px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .copy-btn:hover { background: var(--orange-color); color: #000; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .emu-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; position: relative; display: flex; flex-direction: column; align-items: flex-start; transition: 0.3s; }
        .emu-card:hover { border-color: var(--neon-purple); transform: translateY(-3px); box-shadow: 0 5px 20px rgba(157, 0, 255, 0.1); }
        .emu-badge { position: absolute; top: 20px; right: 20px; background: rgba(157, 0, 255, 0.1); color: var(--neon-purple); border: 1px solid rgba(157, 0, 255, 0.3); font-size: 9px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .emu-icon { width: 45px; height: 45px; background: rgba(157, 0, 255, 0.05); border: 1px solid rgba(157, 0, 255, 0.2); color: var(--neon-purple); display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; margin-bottom: 20px; }
        .emu-title { font-size: 13px; font-weight: 800; color: white; margin-bottom: 20px; text-transform: uppercase; }
        .download-btn { background: #6b4cff; color: white; padding: 8px 20px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .download-btn:hover { background: #5a3ee0; box-shadow: 0 0 15px rgba(107, 76, 255, 0.4); }

        .footer { margin-top: 50px; padding: 30px; text-align: center; font-size: 11px; color: var(--text-gray); border-top: 1px solid var(--border-color); }
        @media (max-width: 768px) { .header { padding: 15px 20px; } .nav-btn span { display: none; } }
    </style>
</head>
<body>
    <div id="mouse-glow-global"></div>

    <header class="header">
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Logo" class="site-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/888/888879.png'">
            <div class="brand-text"><h2>KGFF PANEL</h2><p>PREMIUM CORP</p></div>
        </a>
        <div class="header-right">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> <span>Home</span></a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="nav-btn discord-btn dynamic-discord"><i class="fab fa-discord"></i> <span>Discord</span></a>
        </div>
    </header>

    <div class="container">
        <div class="top-controls">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        </div>

        <div class="video-box" id="videoBox">
            <div class="video-placeholder" id="videoPlaceholder">
                <i class="fas fa-play-circle"></i> NO VIDEO AVAILABLE
            </div>
            <iframe id="videoIframe" src="" style="display: none;" allowfullscreen></iframe>
        </div>

        <div class="title-row">
            <div class="section-title">
                <h2>FREE FIRE APK</h2>
                <p>DOWNLOAD LATEST APK V2.0</p>
            </div>
            <a href="#" id="skipBtn" target="_blank" class="skip-btn" style="display: none;">
                <i class="fas fa-step-forward"></i> HOW TO SKIP
            </a>
        </div>

        <div class="rar-box" id="rarBox" style="display: none;">
            <div class="rar-info">
                <div class="rar-title"><i class="fas fa-lock"></i> RAR PASSWORD</div>
                <div class="rar-pass" id="rarPassValue">---</div>
            </div>
            <button class="copy-btn" onclick="copyPassword()"><i class="far fa-copy"></i> Copy</button>
        </div>

        <div class="grid" id="dataGrid">
            <!-- Items Loaded Here via localStorage -->
        </div>
    </div>

    <div class="footer">© 2026 KGFF PANEL. All rights reserved.</div>

    <script>
        const glow = document.getElementById('mouse-glow-global');
        window.addEventListener('mousemove', (e) => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });

        function formatEmbedUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) return url.replace(/\/view(\?.*)?$/, '/preview');
            if (url.includes('youtube.com/shorts/')) return 'https://www.youtube.com/embed/' + url.split('shorts/')[1].split('?')[0];
            if (url.includes('youtu.be/')) return 'https://www.youtube.com/embed/' + url.split('youtu.be/')[1].split('?')[0];
            if (url.includes('youtube.com/watch')) return 'https://www.youtube.com/embed/' + url.split('v=')[1].split('&')[0];
            return url;
        }

        function loadPageData() {
            // Load Global Discord Link
            const globalLinks = JSON.parse(localStorage.getItem('kgff_global_links') || '{}');
            if (globalLinks.discord) {
                document.querySelectorAll('.dynamic-discord').forEach(btn => btn.href = globalLinks.discord);
            }

            // Load Page Settings from localStorage (managed by admin dashboard)
            const settings = JSON.parse(localStorage.getItem('kgff_settings_apk') || '{}');
            
            // Video Control
            const vUrl = settings.video_url || '';
            const vEnabled = settings.video_enabled !== false;
            const iframe = document.getElementById('videoIframe');
            const placeholder = document.getElementById('videoPlaceholder');
            
            if (vEnabled && vUrl) {
                iframe.src = formatEmbedUrl(vUrl);
                iframe.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                iframe.src = '';
                iframe.style.display = 'none';
                placeholder.style.display = 'flex';
            }

            // Skip Link Control
            const skipUrl = settings.how_to_skip || '';
            const skipEnabled = settings.skip_enabled !== false;
            const skipBtn = document.getElementById('skipBtn');

            if (skipEnabled && skipUrl) {
                skipBtn.href = skipUrl;
                skipBtn.style.display = 'inline-flex';
            } else {
                skipBtn.style.display = 'none';
            }

            // RAR Password Control
            if (settings.rar_password) {
                document.getElementById('rarPassValue').innerText = settings.rar_password;
                document.getElementById('rarBox').style.display = 'flex';
            } else {
                document.getElementById('rarBox').style.display = 'none';
            }

            // Load APK Items Grid from localStorage
            const grid = document.getElementById('dataGrid');
            grid.innerHTML = '';
            
            const items = JSON.parse(localStorage.getItem('kgff_items_apk') || '[]');

            if (!items || items.length === 0) {
                grid.innerHTML = '<div style="color:var(--text-gray); grid-column:1/-1; text-align:center; padding:30px; border:1px dashed var(--border-color); border-radius:12px;">No APK Available</div>';
                return;
            }

            items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            items.forEach((item) => {
                grid.innerHTML += `
                    <div class="emu-card">
                        <div class="emu-badge">LATEST</div>
                        <div class="emu-icon"><i class="fas fa-bolt"></i></div>
                        <div class="emu-title">${item.title || 'FREE FIRE APK'}</div>
                        <a href="${item.download || '#'}" target="_blank" class="download-btn"><i class="fas fa-arrow-down"></i> Download</a>
                    </div>
                `;
            });
        }

        window.copyPassword = function() {
            const pass = document.getElementById('rarPassValue').innerText;
            if(!pass || pass === '---') return;
            navigator.clipboard.writeText(pass);
            alert("Password Copied!");
        };

        // Initialize on load
        window.addEventListener('DOMContentLoaded', loadPageData);
    </script>
</body>
</html>
